  <!-- JAVASCRIPT: LÓGICA MINIMALISTA Y LOCALSTORAGE -->
  <script>
    /* 1. ESTRUCTURA DE LOS 5 LIBROS */
    const BOOKS = [
      { id: 'mateo', name: 'Mateo', chapters: 28 },
      { id: 'marcos', name: 'Marcos', chapters: 16 },
      { id: 'lucas', name: 'Lucas', chapters: 24 },
      { id: 'juan', name: 'Juan', chapters: 21 },
      { id: 'hechos', name: 'Hechos', chapters: 28 }
    ];

    const STORAGE_KEY = 'lectura_biblica_minimal_db';

    /* 2. ESTADO INICIAL */
    let state = {
      darkMode: false,
      activeBook: 'mateo',
      bookmark: '',
      note: '',
      readChapters: {
        mateo: [],
        marcos: [],
        lucas: [],
        juan: [],
        hechos: []
      }
    };

    /* Cargar desde LocalStorage */
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          state = { ...state, ...JSON.parse(saved) };
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          state.darkMode = true;
        }
      } catch (e) {
        console.error("Error al cargar localStorage", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error("Error al guardar localStorage", e);
      }
    }

    /* 3. TEMA OSCURO / CLARO */
    function applyTheme() {
      const html = document.documentElement;
      const sun = document.getElementById('icon-sun');
      const moon = document.getElementById('icon-moon');
      if (state.darkMode) {
        html.classList.add('dark');
        sun.classList.remove('hidden');
        moon.classList.add('hidden');
      } else {
        html.classList.remove('dark');
        sun.classList.add('hidden');
        moon.classList.remove('hidden');
      }
    }

    /* 4. RENDERIZADO DEL SELECTOR DE LIBROS */
    function renderBookSelector() {
      const container = document.getElementById('book-selector');
      container.innerHTML = '';

      BOOKS.forEach(b => {
        const isCurrent = b.id === state.activeBook;
        const readCount = state.readChapters[b.id]?.length || 0;
        const btn = document.createElement('button');
        
        btn.className = `flex-1 py-2 px-3 rounded-xl text-xs font-semibold whitespace-nowrap transition-all border ${
          isCurrent
            ? 'bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900 border-transparent shadow-xs'
            : 'bg-white text-slate-600 dark:bg-silver-800 dark:text-slate-300 border-slate-200 dark:border-silver-700 hover:bg-slate-50'
        }`;

        btn.innerHTML = `${b.name} <span class="opacity-70 text-[10px] ml-0.5">(${readCount}/${b.chapters})</span>`;

        btn.addEventListener('click', () => {
          state.activeBook = b.id;
          saveState();
          renderBookSelector();
          renderActiveBook();
        });

        container.appendChild(btn);
      });
    }

    /* 5. RENDERIZADO DEL LIBRO ACTIVO Y SUS CAPÍTULOS */
    function renderActiveBook() {
      const book = BOOKS.find(b => b.id === state.activeBook);
      if (!book) return;

      const readList = state.readChapters[book.id] || [];
      const readCount = readList.length;
      const percent = Math.round((readCount / book.chapters) * 100);

      document.getElementById('active-book-name').textContent = book.id === 'hechos' ? 'Hechos de los Apóstoles' : `Evangelio de ${book.name}`;
      document.getElementById('active-book-stats').textContent = `${readCount} de ${book.chapters} capítulos completados (${percent}%)`;
      document.getElementById('active-book-bar').style.width = `${percent}%`;

      // Texto de botón alternar todos
      const btnToggleAll = document.getElementById('btn-toggle-all');
      btnToggleAll.textContent = readCount === book.chapters ? 'Desmarcar todo' : 'Marcar todo';

      // Renderizar cuadrícula
      const grid = document.getElementById('chapters-grid');
      grid.innerHTML = '';

      for (let ch = 1; ch <= book.chapters; ch++) {
        const isRead = readList.includes(ch);
        const btn = document.createElement('button');

        btn.className = `h-11 rounded-xl text-xs font-semibold flex items-center justify-center transition border ${
          isRead
            ? 'bg-slate-800 text-white border-slate-800 dark:bg-slate-200 dark:text-slate-900 dark:border-slate-200'
            : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-slate-400 dark:bg-silver-900/50 dark:text-slate-300 dark:border-silver-700'
        }`;

        btn.textContent = ch;

        btn.addEventListener('click', () => {
          toggleChapter(book.id, ch);
        });

        grid.appendChild(btn);
      }

      renderGlobalStats();
    }

    function toggleChapter(bookId, ch) {
      const list = state.readChapters[bookId];
      const idx = list.indexOf(ch);
      if (idx === -1) {
        list.push(ch);
        list.sort((a, b) => a - b);
        showToast(`Capítulo ${ch} completado`);
      } else {
        list.splice(idx, 1);
      }
      saveState();
      renderBookSelector();
      renderActiveBook();
    }

    /* 6. ESTADÍSTICA GLOBAL SENCILLA */
    function renderGlobalStats() {
      let totalRead = 0;
      let totalCapitulos = 117; // 28 + 16 + 24 + 21 + 28

      BOOKS.forEach(b => {
        totalRead += (state.readChapters[b.id] || []).length;
      });

      const globalPct = Math.round((totalRead / totalCapitulos) * 100);
      document.getElementById('global-stats-text').textContent = `${totalRead} de ${totalCapitulos} cap (${globalPct}%)`;
    }

    /* 7. TOAST SENCILLO */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2000);
    }

    /* 8. SONIDO SUAVE Y TEMPORIZADOR DE 5 MINUTOS (Web Audio API) */
    function playSoftChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + (idx * 0.15));
          gain.gain.setValueAtTime(0, ctx.currentTime + (idx * 0.15));
          gain.gain.linearRampToValueAtTime(0.08, ctx.currentTime + (idx * 0.15) + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (idx * 0.15) + 2.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + (idx * 0.15));
          osc.stop(ctx.currentTime + (idx * 0.15) + 2.6);
        });
      } catch (e) {
        console.log("Audio contextual en espera.");
      }
    }

    let timerInterval = null;
    let timerSeconds = 5 * 60;
    let isRunning = false;

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function initTimer() {
      const display = document.getElementById('timer-display');
      const btnStart = document.getElementById('btn-timer-start');
      const btnReset = document.getElementById('btn-timer-reset');
      const panel = document.getElementById('timer-panel');
      const btnToggle = document.getElementById('btn-toggle-timer');

      btnToggle.addEventListener('click', () => {
        panel.classList.toggle('hidden');
      });

      btnStart.addEventListener('click', () => {
        if (!isRunning) {
          isRunning = true;
          btnStart.textContent = 'Pausar';
          timerInterval = setInterval(() => {
            if (timerSeconds > 0) {
              timerSeconds--;
              display.textContent = formatTime(timerSeconds);
            } else {
              clearInterval(timerInterval);
              isRunning = false;
              timerSeconds = 5 * 60;
              display.textContent = "05:00";
              btnStart.textContent = 'Iniciar';
              playSoftChime();
              showToast("¡5 minutos cumplidos con calma!");
            }
          }, 1000);
        } else {
          isRunning = false;
          clearInterval(timerInterval);
          btnStart.textContent = 'Continuar';
        }
      });

      btnReset.addEventListener('click', () => {
        clearInterval(timerInterval);
        isRunning = false;
        timerSeconds = 5 * 60;
        display.textContent = "05:00";
        btnStart.textContent = 'Iniciar';
      });
    }

    /* 9. INICIALIZACIÓN GENERAL */
    document.addEventListener('DOMContentLoaded', () => {
      loadState();
      applyTheme();

      // Configuración de inputs principales
      const inputBookmark = document.getElementById('input-bookmark');
      const inputNote = document.getElementById('input-note');
      const indicator = document.getElementById('save-indicator');

      inputBookmark.value = state.bookmark || '';
      inputNote.value = state.note || '';

      let saveTimeout;
      function handleAutoSave() {
        state.bookmark = inputBookmark.value.trim();
        state.note = inputNote.value.trim();
        saveState();

        indicator.classList.remove('opacity-0');
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          indicator.classList.add('opacity-0');
        }, 1200);
      }

      inputBookmark.addEventListener('input', handleAutoSave);
      inputNote.addEventListener('input', handleAutoSave);

      // Alternar todo el libro
      document.getElementById('btn-toggle-all').addEventListener('click', () => {
        const book = BOOKS.find(b => b.id === state.activeBook);
        const list = state.readChapters[book.id];
        if (list.length === book.chapters) {
          state.readChapters[book.id] = [];
        } else {
          const all = [];
          for (let i = 1; i <= book.chapters; i++) all.push(i);
          state.readChapters[book.id] = all;
        }
        saveState();
        renderBookSelector();
        renderActiveBook();
      });

      // Tema
      document.getElementById('theme-toggle').addEventListener('click', () => {
        state.darkMode = !state.darkMode;
        applyTheme();
        saveState();
      });

      initTimer();
      renderBookSelector();
      renderActiveBook();
    });
  </script>
</body>
</html>
